[package]
name                   = "yazi-plugin"
description            = "Yazi plugin system"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default      = [ "vendored-lua" ]
vendored-lua = [ "mlua/vendored" ]

[dependencies]
yazi-adapter  = { path = "../yazi-adapter", version = "26.8.7" }
yazi-binding  = { path = "../yazi-binding", version = "26.8.7" }
yazi-boot     = { path = "../yazi-boot", version = "26.8.7" }
yazi-config   = { path = "../yazi-config", version = "26.8.7" }
yazi-dds      = { path = "../yazi-dds", version = "26.8.7" }
yazi-emulator = { path = "../yazi-emulator", version = "26.8.7" }
yazi-fs       = { path = "../yazi-fs", version = "26.8.7" }
yazi-macro    = { path = "../yazi-macro", version = "26.8.7" }
yazi-parser   = { path = "../yazi-parser", version = "26.8.7" }
yazi-proxy    = { path = "../yazi-proxy", version = "26.8.7" }
yazi-shared   = { path = "../yazi-shared", version = "26.8.7" }
yazi-shim     = { path = "../yazi-shim", version = "26.8.7" }
yazi-term     = { path = "../yazi-term", version = "26.8.7" }
yazi-vfs      = { path = "../yazi-vfs", version = "26.8.7" }
yazi-widgets  = { path = "../yazi-widgets", version = "26.8.7" }

# External dependencies
ansi-to-tui   = { workspace = true }
anyhow        = { workspace = true }
futures       = { workspace = true }
hashbrown     = { workspace = true }
mlua          = { workspace = true }
parking_lot   = { workspace = true }
paste         = { workspace = true }
ratatui       = { workspace = true }
serde_json    = { workspace = true }
syntect       = { workspace = true }
tokio         = { workspace = true }
tokio-stream  = { workspace = true }
tokio-util    = { workspace = true }
tracing       = { workspace = true }
twox-hash     = { workspace = true }
unicode-width = { workspace = true }
yazi-prebuilt = "0.1.0"

[target."cfg(unix)".dependencies]
libc  = { workspace = true }
uzers = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [ "Win32_System_JobObjects" ] }
