name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            gcc: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gcc cross-compiler
        if: matrix.gcc != ''
        run: sudo apt update && sudo apt install -yq ${{ matrix.gcc }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="che-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp target/${{ matrix.target }}/release/che "${ARCHIVE_NAME}/"
          cp target/${{ matrix.target }}/release/ch "${ARCHIVE_NAME}/"
          cp README.md LICENSE CHANGELOG.md "${ARCHIVE_NAME}/"
          zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            ./scripts/appimage.sh "${{ matrix.target }}" || true
          fi

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tagName = $env:GITHUB_REF -replace 'refs/tags/', ''
          $archiveName = "che-$tagName-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $archiveName
          Copy-Item "target/${{ matrix.target }}/release/che.exe" -Destination $archiveName
          Copy-Item "target/${{ matrix.target }}/release/ch.exe" -Destination $archiveName
          Copy-Item "README.md", "LICENSE", "CHANGELOG.md" -Destination $archiveName
          Compress-Archive -Path $archiveName -DestinationPath "${archiveName}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            *.zip
            *.AppImage

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.AppImage
          generate_release_notes: true

      - name: Publish to Winget
        if: env.WINGET_TOKEN != ''
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: aroum.che
          installers-regex: 'che-.*-(x86_64|aarch64)-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      - name: Update Homebrew Formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        continue-on-error: true
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: che
          homebrew-tap: aroum/homebrew-che
          download-url: https://github.com/aroum/che/releases/download/${{ github.ref_name }}/che-${{ github.ref_name }}-x86_64-apple-darwin.zip
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Publish to Snapcraft Store
        if: env.SNAPCRAFT_TOKEN != ''
        continue-on-error: true
        uses: snapcore/action-publish@v1
        with:
          snap: '*.snap'
          release: stable
          store_login: ${{ secrets.SNAPCRAFT_TOKEN }}
        env:
          SNAPCRAFT_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN }}
