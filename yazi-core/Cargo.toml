[package]
name                   = "yazi-core"
description            = "Yazi core logic"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yazi-adapter   = { path = "../yazi-adapter", version = "26.8.7" }
yazi-binding   = { path = "../yazi-binding", version = "26.8.7" }
yazi-config    = { path = "../yazi-config", version = "26.8.7" }
yazi-dds       = { path = "../yazi-dds", version = "26.8.7" }
yazi-emulator  = { path = "../yazi-emulator", version = "26.8.7" }
yazi-fs        = { path = "../yazi-fs", version = "26.8.7" }
yazi-macro     = { path = "../yazi-macro", version = "26.8.7" }
yazi-parser    = { path = "../yazi-parser", version = "26.8.7" }
yazi-plugin    = { path = "../yazi-plugin", version = "26.8.7" }
yazi-proxy     = { path = "../yazi-proxy", version = "26.8.7" }
yazi-scheduler = { path = "../yazi-scheduler", version = "26.8.7" }
yazi-shared    = { path = "../yazi-shared", version = "26.8.7" }
yazi-vfs       = { path = "../yazi-vfs", version = "26.8.7" }
yazi-watcher   = { path = "../yazi-watcher", version = "26.8.7" }
yazi-widgets   = { path = "../yazi-widgets", version = "26.8.7" }

# External dependencies
anyhow        = { workspace = true }
crossterm     = { workspace = true }
hashbrown     = { workspace = true }
indexmap      = { workspace = true }
parking_lot   = { workspace = true }
ratatui       = { workspace = true }
tokio         = { workspace = true }
tokio-stream  = { workspace = true }
tokio-util    = { workspace = true }
tracing       = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { workspace = true, features = [ "use-dev-tty", "libc" ] }
